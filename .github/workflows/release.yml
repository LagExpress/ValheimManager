name: Build & Release Cross-Platform Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev file

      - name: Build Release Binary
        run: cargo build --release

      - name: Package AppImage
        run: |
          mkdir -p build/AppDir/usr/bin
          mkdir -p build/AppDir/usr/share/applications
          mkdir -p build/AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p dist

          cp target/release/valheim-modpack-studio build/AppDir/usr/bin/
          cp target/release/valheim-modpack-studio build/AppDir/
          cp valheim-modpack-studio.desktop build/AppDir/usr/share/applications/
          cp valheim-modpack-studio.desktop build/AppDir/
          cp src/assets/icon.png build/AppDir/usr/share/icons/hicolor/256x256/apps/valheim-modpack-studio.png
          cp src/assets/icon.png build/AppDir/valheim-modpack-studio.png
          cp src/assets/icon.png build/AppDir/.DirIcon

          cat << 'EOF' > build/AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/valheim-modpack-studio" "$@"
          EOF
          chmod +x build/AppDir/AppRun

          curl -sL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun build/AppDir dist/ValheimModpackStudio-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValheimModpackStudio-Linux-AppImage
          path: dist/ValheimModpackStudio-x86_64.AppImage

  build-windows-exe:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Windows Dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/valheim-modpack-studio.exe dist/ValheimModpackStudio-x86_64.exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValheimModpackStudio-Windows-x64
          path: dist/ValheimModpackStudio-x86_64.exe

  publish-release:
    name: Publish Release (on Tag)
    needs: [build-linux-appimage, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ValheimModpackStudio-Linux-AppImage
          path: dist

      - name: Download Windows Exe
        uses: actions/download-artifact@v4
        with:
          name: ValheimModpackStudio-Windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ValheimModpackStudio-x86_64.AppImage
            dist/ValheimModpackStudio-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
