name: Build & Release Cross-Platform Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Read package version and verify release tag
        id: package
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "valheim-modpack-studio"))')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: quality

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev pkg-config zlib1g-dev perl file

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Check legacy CLI syntax
        run: node --check valheim-pack.js

  build-linux-appimage:
    name: Build Linux AppImage
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.quality.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: linux-release

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev pkg-config zlib1g-dev perl file libfuse2

      - name: Build Release Binary
        run: cargo build --locked --release

      - name: Package AppImage
        run: |
          mkdir -p build/AppDir/usr/bin
          mkdir -p build/AppDir/usr/share/applications
          mkdir -p build/AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p dist

          cp target/release/valheim-modpack-studio build/AppDir/usr/bin/
          cp target/release/valheim-modpack-studio build/AppDir/
          cp valheim-modpack-studio.desktop build/AppDir/usr/share/applications/
          cp valheim-modpack-studio.desktop build/AppDir/
          cp src/assets/icon.png build/AppDir/usr/share/icons/hicolor/256x256/apps/valheim-modpack-studio.png
          cp src/assets/icon.png build/AppDir/valheim-modpack-studio.png
          cp src/assets/icon.png build/AppDir/.DirIcon

          cat << 'EOF' > build/AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/valheim-modpack-studio" "$@"
          EOF
          chmod +x build/AppDir/AppRun

          curl -fsSL --retry 3 -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum --check --strict
          curl -fsSL --retry 3 -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" | sha256sum --check --strict
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun --runtime-file "$PWD/runtime-x86_64" build/AppDir "dist/ValheimManager-${VERSION}.AppImage"

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Linux-AppImage
          path: dist/ValheimManager-${{ needs.quality.outputs.version }}.AppImage
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows .exe
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.quality.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows-release

      - name: Build Release Binary
        run: cargo build --locked --release

      - name: Prepare Windows Dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/valheim-modpack-studio.exe "dist/ValheimManager-${VERSION}.exe"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Windows
          path: dist/ValheimManager-${{ needs.quality.outputs.version }}.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release (on Tag)
    needs: [quality, build-linux-appimage, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.quality.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Download Linux AppImage
        uses: actions/download-artifact@v8.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Linux-AppImage
          path: dist

      - name: Download Windows Exe
        uses: actions/download-artifact@v8.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Windows
          path: dist

      - name: Checksum release binaries
        shell: bash
        run: |
          test -s "dist/ValheimManager-${VERSION}.AppImage"
          test -s "dist/ValheimManager-${VERSION}.exe"
          cd dist
          sha256sum "ValheimManager-${VERSION}.AppImage" "ValheimManager-${VERSION}.exe" > "SHA256SUMS-${VERSION}.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ValheimManager v${{ needs.quality.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: legacy
          files: |
            dist/ValheimManager-${{ needs.quality.outputs.version }}.AppImage
            dist/ValheimManager-${{ needs.quality.outputs.version }}.exe
            dist/SHA256SUMS-${{ needs.quality.outputs.version }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
