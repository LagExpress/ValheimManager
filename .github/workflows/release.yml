name: Build & Release Cross-Platform Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Read package version and verify release tag
        id: package
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "valheim-modpack-studio"))')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          bash scripts/release-notes.sh "$version" > /dev/null

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: quality

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev pkg-config zlib1g-dev perl file

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Check legacy CLI syntax
        run: node --check valheim-pack.js

  build-linux-appimage:
    name: Build Linux AppImage
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.quality.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: linux-release

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxrender1 libxext6 libxfixes3 libxcb1 libegl1 libgl1 libvulkan1 libwayland-egl1 pkg-config zlib1g-dev perl file libfuse2 patchelf squashfs-tools xvfb x11-utils libgl1-mesa-dri mesa-vulkan-drivers

      - name: Package AppImage
        run: bash scripts/build-appimage.sh

      - name: Smoke-test the packaged application
        run: bash scripts/smoke-appimage.sh "dist/ValheimManager-${VERSION}.AppImage"

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Linux-AppImage
          path: dist/ValheimManager-${{ needs.quality.outputs.version }}.AppImage
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows .exe
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.quality.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows-release

      - name: Build Release Binary
        run: cargo build --locked --release

      - name: Prepare Windows Dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/valheim-modpack-studio.exe "dist/ValheimManager-${VERSION}.exe"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Windows
          path: dist/ValheimManager-${{ needs.quality.outputs.version }}.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release (on Tag)
    needs: [quality, build-linux-appimage, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.quality.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Read release changelog
        shell: bash
        run: bash scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Download Linux AppImage
        uses: actions/download-artifact@v8.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Linux-AppImage
          path: dist

      - name: Download Windows Exe
        uses: actions/download-artifact@v8.0.2
        with:
          name: ValheimManager-${{ needs.quality.outputs.version }}-Windows
          path: dist

      - name: Checksum release binaries
        shell: bash
        run: |
          test -s "dist/ValheimManager-${VERSION}.AppImage"
          test -s "dist/ValheimManager-${VERSION}.exe"
          cd dist
          sha256sum "ValheimManager-${VERSION}.AppImage" "ValheimManager-${VERSION}.exe" > "SHA256SUMS-${VERSION}.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ValheimManager v${{ needs.quality.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: legacy
          files: |
            dist/ValheimManager-${{ needs.quality.outputs.version }}.AppImage
            dist/ValheimManager-${{ needs.quality.outputs.version }}.exe
            dist/SHA256SUMS-${{ needs.quality.outputs.version }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
