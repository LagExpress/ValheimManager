[package]
name = "valheim-modpack-studio"
version = "0.1.10"
edition = "2021"
authors = ["Mateo"]
description = "Cross-platform GUI for creating Valheim modpacks and syncing BepInEx files to dedicated servers"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
walkdir = "2.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
rfd = "0.17"
dirs = "7.0"
regex = "1.10"
opener = "0.9.0"
sha2 = "0.11.1"
raw-window-handle = "0.6.2"
glob = "0.3"
semver = "1.0"

[target.'cfg(unix)'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
ssh2 = "0.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.15", features = ["system", "dlopen"] }
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
winit = { version = "0.30.13", default-features = false, features = ["wayland", "x11"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
